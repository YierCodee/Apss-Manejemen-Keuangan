  <circle cx="90" cy="70" r="65" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Person silhouette -->
  <circle cx="90" cy="45" r="18" fill="rgba(255,255,255,0.9)"/>
  <path d="M60 85 C60 65 120 65 120 85 L120 110 C120 115 115 120 110 120 L70 120 C65 120 60 115 60 110 Z" fill="rgba(255,255,255,0.9)"/>
  
  <!-- Coin -->
  <circle cx="130" cy="50" r="15" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
