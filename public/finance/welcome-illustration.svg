  <!-- Chart bars -->
  <rect x="25" y="90" width="8" height="25" rx="2" fill="rgba(255,255,255,0.6)"/>
  <rect x="38" y="80" width="8" height="35" rx="2" fill="rgba(255,255,255,0.7)"/>
  <rect x="51" y="70" width="8" height="45" rx="2" fill="rgba(255,255,255,0.8)"/>
  
  <!-- Floating elements -->
